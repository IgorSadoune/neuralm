model_type: cnn2d
name: MNIST_CNN
in_channels: 1
layers:
  - type: conv2d
    in_channels: 1
    out_channels: 32
    kernel_size: 3
    stride: 1
    padding: 1
  - type: relu
    inplace: true
  - type: maxpool2d
    kernel_size: 2
  - type: conv2d
    in_channels: 32
    out_channels: 64
    kernel_size: 3
    stride: 1
    padding: 1
  - type: relu
    inplace: true
  - type: maxpool2d
    kernel_size: 2
  - type: flatten
  - type: linear
    in_features: 3136  # 64 * 7 * 7
    out_features: 128
  - type: relu
  - type: linear
    in_features: 128
    out_features: 10